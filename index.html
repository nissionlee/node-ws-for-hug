<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>望庐山瀑布 - 李白</title>
    <style>
        body {
            font-family: "Microsoft YaHei", "SimSun", serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: linear-gradient(to bottom, #e0f7fa, #ffffff);
        }
        .poem-container {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 600px;
            width: 90%;
        }
        .title {
            font-size: 28px;
            margin-bottom: 30px;
            color: #333;
            border-bottom: 2px solid #4fc3f7;
            padding-bottom: 10px;
        }
        .author {
            font-size: 20px;
            margin-bottom: 30px;
            color: #555;
        }
        .content {
            font-size: 24px;
            line-height: 1.8;
            color: #222;
            white-space: pre-line;
        }
        .note {
            margin-top: 30px;
            font-size: 14px;
            color: #777;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="poem-container">
        <div class="title">望庐山瀑布</div>
        <div class="author">李白</div>
        <div class="content">日照香炉生紫烟，
遥看瀑布挂前川。
飞流直下三千尺，
疑是银河落九天。</div>
        <div class="note">注：庐山是中国名山之一，位于江西省九江市南。庐山上有香炉峰，风景奇秀[[1]]。</div>
    </div>
</body>
</html>
